[project]
name = "agentarchitecture"
version = "0.1.0"
description = "Provider-neutral multi-agent runtime with MCP tool integration"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx2>=2.13.0",
    "mcp[cli]>=2,<3",
    "pandas>=2.2,<4",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_system"]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
